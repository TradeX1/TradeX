<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Exchange</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  font-size:26px;
  padding:15px;
  font-weight:bold;
  background:#111;
  border-bottom:1px solid #222;
}

/* CONTAINER */
.container{
  max-width:400px;
  margin:auto;
}

/* CARD BOX */
.card{
  background:#111;
  padding:15px;
  margin:15px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(255,165,0,0.2);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#222;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:orange;
  color:white;
  font-size:16px;
}

/* BALANCE */
.balance{
  font-size:28px;
  color:orange;
  margin:10px;
}

/* VIP BADGE */
.vip{
  background:gold;
  color:black;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
  margin-bottom:10px;
}

</style>
</head>

<body>

<div class="header">💰 Trading Exchange</div>

<!-- AUTH -->
<div id="auth">
  <div class="container">

    <div class="card">
      <h3>Signup</h3>
      <input id="su_email" placeholder="Email">
      <input id="su_user" placeholder="Username">
      <input id="su_pass" type="password" placeholder="Password">
      <button onclick="signup()">Sign Up</button>
    </div>
    <div class="card">
  <h3>Login</h3>
  <input id="li_email" placeholder="Email">
  <input id="li_pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
    </div>
</div>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<div class="header">📊 Trading Dashboard</div>

<div class="container">
<div class="header">📊 Trading Dashboard</div>
  <div class="card">
    <h3>Welcome <span id="user"></span></h3>
    <p>Email: <span id="email"></span></p>
  </div>

  <div class="card">
    <h3>Total Balance</h3>
    <h1 style="color:orange;">$<span id="bal">0</span></h1>

    <button onclick="openDeposit()">➕ Add Funds</button>
  </div>

  <div class="card">
    <h3>Market</h3>
    <button onclick="selectCoin('BTCUSDT')">BTC</button>
    <button onclick="selectCoin('ETHUSDT')">ETH</button>
    <button onclick="selectCoin('BNBUSDT')">BNB</button>
    <button onclick="selectCoin('SOLUSDT')">SOL</button>
    <button onclick="selectCoin('XRPUSDT')">XRP</button>
  </div>

  <div class="card">
    <h3>Live Price</h3>
    <h2 id="price">$0</h2>
  </div>

  <div class="card">
    <h3>Trade</h3>
    <input id="amount" placeholder="Enter Amount">
    <button onclick="buy()">Buy</button>
    <button onclick="sell()">Sell</button>
  </div>

  <div class="card">
    <h3>Live Chart</h3>
    <iframe id="chartBox" width="100%" height="300"></iframe>
  </div>

  <div id="adminPanel" style="display:none">
    <div class="card">
      <h3>👑 Admin Panel</h3>
      <div id="usersList"></div>
    </div>
  </div>

  <button onclick="logout()">Logout</button>

</div>
</div>

<script>

// ADMIN LOGIN
let adminEmail = "admin@gmail.com";
let adminPass = "123456";

// SIGNUP
function signup() {
  let email = document.getElementById("su_email").value;
  let user = document.getElementById("su_user").value;
  let pass = document.getElementById("su_pass").value;

  let data = {
    email: email,
    user: user,
    pass: pass,
    balance: 0
  };

  localStorage.setItem(email, JSON.stringify(data));
  alert("Signup Success ✅");
}


// LOGIN
function login() {
  let email = document.getElementById("li_email").value;
  let pass = document.getElementById("li_pass").value;

  let data = localStorage.getItem(email);

  if (!data) {
    alert("User not found ❌");
    return;
  }

  data = JSON.parse(data);

  if (data.pass === pass) {
    localStorage.setItem("current", email);
    show();
  } else {
    alert("Wrong Password ❌");
  }
}
  

// SHOW DASHBOARD
function show(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));
  document.getElementById("email").innerText = email;
  auth.style.display="none";
  dashboard.style.display="block";

  user.innerText = data.user;
  bal.innerText = data.balance;
  selectCoin("BTCUSDT");
  // ADMIN CHECK
  if(email == adminEmail){
  adminPanel.style.display="block";
  loadUsers();
}
}

// INCREASE BALANCE
function add(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  data.balance += 100;
  localStorage.setItem(email, JSON.stringify(data));

  show();
}

// DECREASE BALANCE
function minus(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  data.balance -= 100;
  localStorage.setItem(email, JSON.stringify(data));

  show();
}

// LOGOUT
function logout(){
  localStorage.removeItem("current");
  location.reload();
}
function loadUsers(){
  let html = "";

  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);

    if(key == "current") continue;

    let data = JSON.parse(localStorage.getItem(key));

    html += `
      <div style="background:#222; padding:10px; margin:10px; border-radius:8px;">
        <b>${data.user}</b> (${data.email}) <br>
        Balance: $${data.balance} <br><br>

        <button onclick="updateBal('${key}', 100)">+100</button>
<button onclick="updateBal('${key}', -100)">-100</button>
      </div>
    `;
  }

  usersList.innerHTML = html;
}
  function updateBal(email, amount){
  let data = JSON.parse(localStorage.getItem(email));

  data.balance += amount;

  localStorage.setItem(email, JSON.stringify(data));

  loadUsers();

                       }
// AUTO LOGIN
if(localStorage.getItem("current")){
  show();
}
let currentCoin = "BTCUSDT";
let currentPrice = 0;

// COIN SELECT
function selectCoin(symbol) {
  currentCoin = symbol;

  document.getElementById("chartBox").src =
    "https://s.tradingview.com/widgetembed/?symbol=BINANCE:" + symbol + "&interval=1";

  loadPrice();
}

// LOAD LIVE PRICE
async function loadPrice() {
  let res = await fetch(`https://api.binance.com/api/v3/ticker/price?symbol=${currentCoin}`);
  let data = await res.json();

  currentPrice = parseFloat(data.price);
  price.innerText = currentPrice.toFixed(2);
}

// AUTO UPDATE PRICE
setInterval(loadPrice, 2000);

// BUY
function buy() {
  let amt = parseFloat(amount.value);
  if (!amt) return alert("Enter amount");

  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  let cost = amt * currentPrice;

  if (data.balance < cost) {
    alert("Not enough balance ❌");
    return;
  }

  data.balance -= cost;
  localStorage.setItem(email, JSON.stringify(data));

  alert("Buy Success ✅");
  show();
}

// SELL
function sell() {
  let amt = parseFloat(amount.value);
  if (!amt) return alert("Enter amount");

  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  let gain = amt * currentPrice;

  data.balance += gain;
  localStorage.setItem(email, JSON.stringify(data));

  alert("Sell Success ✅");
  show();
                       }
</script>

</body>
</html>
