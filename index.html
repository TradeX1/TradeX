<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Exchange</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#000;
  color:white;
  text-align:center;
}

/* HEADER */
.header{
  font-size:26px;
  padding:15px;
  font-weight:bold;
  background:#111;
  border-bottom:1px solid #222;
}

/* CONTAINER */
.container{
  max-width:400px;
  margin:auto;
}

/* CARD BOX */
.card{
  background:#111;
  padding:15px;
  margin:15px;
  border-radius:12px;
  box-shadow:0 0 10px rgba(255,165,0,0.2);
}

/* INPUT */
input{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:#222;
  color:white;
}

/* BUTTON */
button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:6px;
  background:orange;
  color:white;
  font-size:16px;
}

/* BALANCE */
.balance{
  font-size:28px;
  color:orange;
  margin:10px;
}

/* VIP BADGE */
.vip{
  background:gold;
  color:black;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
  margin-bottom:10px;
}

</style>
</head>

<body>

<div class="header">💰 Trading Exchange</div>

<!-- AUTH -->
<div id="auth">
  <div class="container">

    <div class="card">
      <h3>Signup</h3>
      <input id="su_email" placeholder="Email">
      <input id="su_user" placeholder="Username">
      <input id="su_pass" type="password" placeholder="Password">
      <button onclick="signup()">Sign Up</button>
    </div>

    <div class="card">
      <h3>Login</h3>
      <input id="li_email" placeholder="Email">
      <input id="li_pass" type="password" placeholder="Password">
      <button onclick="login()">Login</button>
    </div>

  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

  <div class="vip">VIP USER</div>

  <h2>Welcome <span id="user"></span></h2>
  <div class="balance">$<span id="bal">0</span></div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" style="display:none">
  <div class="card">
    <h3>👑 Admin Panel</h3>
    <div id="usersList"></div>
  </div>
</div>

  <button onclick="logout()">Logout</button>

</div>

<script>

// ADMIN LOGIN
let adminEmail = "admin@gmail.com";
let adminPass = "123456";

// SIGNUP
function signup(){
  let email = su_email.value;
  let user = su_user.value;
  let pass = su_pass.value;

  let data = {email,user,pass,balance:0};
  localStorage.setItem(email, JSON.stringify(data));

  alert("Signup Success");
}

// LOGIN
function login(){
  let email = li_email.value;
  let pass = li_pass.value;

  let data = JSON.parse(localStorage.getItem(email));

  if(data && data.pass == pass){
    localStorage.setItem("current", email);
    show();
  } else {
    alert("Wrong Login");
  }
}

// SHOW DASHBOARD
function show(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  auth.style.display="none";
  dashboard.style.display="block";

  user.innerText = data.user;
  bal.innerText = data.balance;

  // ADMIN CHECK
  if(email == adminEmail){
  adminPanel.style.display="block";
  loadUsers();
}
}

// INCREASE BALANCE
function add(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  data.balance += 100;
  localStorage.setItem(email, JSON.stringify(data));

  show();
}

// DECREASE BALANCE
function minus(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  data.balance -= 100;
  localStorage.setItem(email, JSON.stringify(data));

  show();
}

// LOGOUT
function logout(){
  localStorage.removeItem("current");
  location.reload();
}
function loadUsers(){
  let html = "";

  for(let i=0; i<localStorage.length; i++){
    let key = localStorage.key(i);

    if(key == "current") continue;

    let data = JSON.parse(localStorage.getItem(key));

    html += `
      <div style="background:#222; padding:10px; margin:10px; border-radius:8px;">
        <b>${data.user}</b> (${data.email}) <br>
        Balance: $${data.balance} <br><br>

        <button onclick="updateBal('${data.email}', 100)">+100</button>
        <button onclick="updateBal('${data.email}', -100)">-100</button>
      </div>
    `;
  }

  usersList.innerHTML = html;}function updateBal(email, amount){
  let data = JSON.parse(localStorage.getItem(email));

  data.balance += amount;

  localStorage.setItem(email, JSON.stringify(data));

  loadUsers();
}
                       }
// AUTO LOGIN
if(localStorage.getItem("current")){
  show();
}

</script>

</body>
</html>
