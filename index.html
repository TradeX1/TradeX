<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradeX Ultimate</title>

<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
.header{background:#ff9800;padding:15px;text-align:center;font-weight:bold}
.card{background:#111;padding:15px;margin:10px;border-radius:10px}
input,button{width:100%;padding:10px;margin-top:10px;border:none;border-radius:5px}
button{background:#ff9800;color:#fff}
</style>
</head>

<body>

<div class="header">🔥 TradeX Ultimate</div>

<!-- AUTH -->
<div id="auth">
<div class="card">
<h3>Signup</h3>
<input id="su_email" placeholder="Email">
<input id="su_pass" placeholder="Password">
<button onclick="signup()">Signup</button>
</div>

<div class="card">
<h3>Login</h3>
<input id="li_email" placeholder="Email">
<input id="li_pass" placeholder="Password">
<button onclick="login()">Login</button>
</div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none">

<div class="card">
<p id="userEmail"></p>
<h2>Balance: $<span id="bal">0</span></h2>
</div>

<div class="card">
<input id="amount" placeholder="Amount">
<button onclick="buy()">Buy</button>
<button onclick="sell()">Sell</button>
</div>

<div class="card">
<button onclick="deposit()">Deposit</button>
<button onclick="withdraw()">Withdraw</button>
</div>

<div class="card">
<h3>Orders</h3>
<div id="ordersBox"></div>
</div>

<div class="card">
<h3>Chat</h3>
<input id="msg">
<button onclick="sendMsg()">Send</button>
</div>

<div id="adminPanel" style="display:none">
<div class="card">
<h3>👑 Admin Panel</h3>

<h4>Users</h4>
<div id="usersList"></div>

<h4>Deposits</h4>
<div id="deposits"></div>

<h4>Withdraws</h4>
<div id="withdraws"></div>

</div>
</div>

<button onclick="logout()">Logout</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc, addDoc, collection, getDocs, updateDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app = initializeApp({
  apiKey: "AIzaSyCbMvOjA4m1QtnuRt7m7jXAddQq-W-Sh-k",
  authDomain: "tradex-support.firebaseapp.com",
  projectId: "tradex-support"
});

const db = getFirestore(app);
const auth = getAuth(app);

// SIGNUP
window.signup = async ()=>{
let email = su_email.value;
let pass = su_pass.value;

if(!email || !pass){
alert("Enter details ❌");
return;
}

try{
let res = await createUserWithEmailAndPassword(auth,email,pass);

await setDoc(doc(db,"users",res.user.uid),{
email: email,
balance: 1000
});

alert("Signup success ✅");
}catch(e){
alert(e.message);
}
}

// LOGIN
window.login = async ()=>{
let email = li_email.value;
let pass = li_pass.value;

if(!email || !pass){
alert("Enter login details ❌");
return;
}

try{
await signInWithEmailAndPassword(auth,email,pass);
}catch(e){
alert("Wrong login ❌");
}
}

// AUTO LOGIN
onAuthStateChanged(auth,(user)=>{
if(user){

authBox.style.display="none";
dashboard.style.display="block";

userEmail.innerText=user.email;

// REAL-TIME BALANCE
onSnapshot(doc(db,"users",user.uid),(snap)=>{
bal.innerText=snap.data().balance;
});

loadOrders();

if(user.email=="admin@tradex.com"){
adminPanel.style.display="block";
loadUsers();
loadDeposits();
loadWithdraws();
}

}else{
authBox.style.display="block";
dashboard.style.display="none";
}
});

// BUY
window.buy=async ()=>{
let u=auth.currentUser;
let ref=doc(db,"users",u.uid);
let snap=await getDoc(ref);

await updateDoc(ref,{
balance:snap.data().balance+Number(amount.value)
});

await addDoc(collection(db,"orders"),{
uid:u.uid,type:"buy",amount:Number(amount.value)
});
}

// SELL
window.sell=async ()=>{
let u=auth.currentUser;
let ref=doc(db,"users",u.uid);
let snap=await getDoc(ref);

await updateDoc(ref,{
balance:snap.data().balance-Number(amount.value)
});

await addDoc(collection(db,"orders"),{
uid:u.uid,type:"sell",amount:Number(amount.value)
});
}

// DEPOSIT
window.deposit=async ()=>{
let u=auth.currentUser;
let amt=Number(prompt("Deposit amount"));

if(!amt)return;

await addDoc(collection(db,"transactions"),{
uid:u.uid,type:"deposit",amount:amt,status:"pending"
});
alert("Deposit request sent");
}

// WITHDRAW
window.withdraw=async ()=>{
let u=auth.currentUser;
let amt=Number(prompt("Withdraw amount"));

let snap=await getDoc(doc(db,"users",u.uid));

if(amt>snap.data().balance){
alert("Low balance ❌");
return;
}

await addDoc(collection(db,"transactions"),{
uid:u.uid,type:"withdraw",amount:amt,status:"pending"
});
alert("Withdraw request sent");
}

// LOAD ORDERS
async function loadOrders(){
let u=auth.currentUser;
let snap=await getDocs(collection(db,"orders"));
let html="";
snap.forEach(doc=>{
let d=doc.data();
if(d.uid==u.uid){
html+=`<p>${d.type} - ${d.amount}</p>`;
}
});
ordersBox.innerHTML=html;
}

// ADMIN USERS
async function loadUsers(){
let snap=await getDocs(collection(db,"users"));
let html="";
snap.forEach(doc=>{
html+=`<p>${doc.data().email}</p>`;
});
usersList.innerHTML=html;
}

// LOAD DEPOSITS
async function loadDeposits(){
let snap=await getDocs(collection(db,"transactions"));
let html="";
snap.forEach(docSnap=>{
let d=docSnap.data();
if(d.type=="deposit" && d.status=="pending"){
html+=`<p>${d.uid} $${d.amount}
<button onclick="approveDeposit('${docSnap.id}','${d.uid}',${d.amount})">Approve</button></p>`;
}
});
deposits.innerHTML=html;
}

// APPROVE DEPOSIT
window.approveDeposit=async(id,uid,amt)=>{
let ref=doc(db,"users",uid);
let snap=await getDoc(ref);

await updateDoc(ref,{
balance:snap.data().balance+amt
});

await updateDoc(doc(db,"transactions",id),{status:"done"});

alert("Deposit Approved");
loadDeposits();
}

// LOAD WITHDRAW
async function loadWithdraws(){
let snap=await getDocs(collection(db,"transactions"));
let html="";
snap.forEach(docSnap=>{
let d=docSnap.data();
if(d.type=="withdraw" && d.status=="pending"){
html+=`<p>${d.uid} $${d.amount}
<button onclick="approveWithdraw('${docSnap.id}','${d.uid}',${d.amount})">Approve</button></p>`;
}
});
withdraws.innerHTML=html;
}

// APPROVE WITHDRAW
window.approveWithdraw=async(id,uid,amt)=>{
let ref=doc(db,"users",uid);
let snap=await getDoc(ref);

await updateDoc(ref,{
balance:snap.data().balance-amt
});

await updateDoc(doc(db,"transactions",id),{status:"done"});

alert("Withdraw Approved");
loadWithdraws();
}

// CHAT
window.sendMsg=async ()=>{
let u=auth.currentUser;
await addDoc(collection(db,"chat"),{
uid:u.uid,
msg:msg.value
});
msg.value="";
}

// LOGOUT
window.logout=()=>signOut(auth);

</script>

</body>
</html>
