<!DOCTYPE html>
<html>
<head>
  <title>Trade X Global</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body { margin:0; font-family:Arial; background:#0b0f1a; color:white; }

    .screen { display:none; padding:20px; }
    .active { display:block; }

    h1 { color:#00ff88; }

    input, button {
      width:90%; padding:12px; margin:10px;
      border:none; border-radius:10px;
    }

    button { background:#00ff88; font-weight:bold; }

    .card {
      background:#111827;
      padding:15px;
      border-radius:12px;
      margin:10px 0;
    }

    .locked {
      opacity:0.5;
    }

    .nav {
      position:fixed;
      bottom:0;
      width:100%;
      display:flex;
      background:#111;
    }

    .nav button {
      flex:1;
      background:none;
      color:white;
    }
  </style>
</head>

<body>

<!-- LOGIN / SIGNUP -->
<div id="login" class="screen active">
  <h1>Trade X Global</h1>
  <h3>Sign Up / Login</h3>
  <input id="user" placeholder="Username">
  <input type="password" placeholder="Password">
  <button onclick="enter()">Continue</button>
</div>

<!-- HOME -->
<div id="home" class="screen">
  <h1>Dashboard</h1>

  <div class="card">
    <p>Balance</p>
    <h2>$<span id="balance">0</span></h2>
  </div>

  <div class="card">
    <p>Complete tasks to unlock higher earnings</p>
  </div>
</div>

<!-- TASKS -->
<div id="tasks" class="screen">
  <h1>Tasks</h1>

  <div class="card">
    <p>Task 1 → Earn $5</p>
    <button onclick="completeTask(1,5)">Complete</button>
  </div>

  <div class="card locked" id="t2">
    <p>Task 2 → Earn $15 (Locked)</p>
    <button onclick="locked()">Locked</button>
  </div>

  <div class="card locked" id="t3">
    <p>Task 3 → Earn $30 (Locked)</p>
    <button onclick="locked()">Locked</button>
  </div>
</div>

<!-- PROFILE -->
<div id="profile" class="screen">
  <h1>Profile</h1>
  <div class="card">
    <p id="usernameText"></p>
  </div>
  <button onclick="logout()">Logout</button>
</div>

<!-- NAV -->
<div class="nav">
  <button onclick="show('home')">Home</button>
  <button onclick="show('tasks')">Tasks</button>
  <button onclick="show('profile')">Profile</button>
</div>

<script>
let balance = parseInt(localStorage.getItem("balance")) || 0;
let done1 = localStorage.getItem("done1") || false;

document.getElementById("balance").innerText = balance;

function enter(){
  let u = document.getElementById("user").value;
  localStorage.setItem("user", u);
  document.getElementById("usernameText").innerText = "User: " + u;

  document.getElementById("login").classList.remove("active");
  show('home');

  if(done1){
    unlock();
  }
}

function show(page){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(page).classList.add("active");
}

function completeTask(num, amount){
  if(num === 1){
    balance += amount;
    localStorage.setItem("done1", true);
    localStorage.setItem("balance", balance);
    document.getElementById("balance").innerText = balance;
    unlock();
    alert("Task 1 Completed +$5");
  }
}

function unlock(){
  document.getElementById("t2").classList.remove("locked");
  document.getElementById("t2").innerHTML = `
    <p>Task 2 → Earn $15</p>
    <button onclick="earn(15,2)">Complete</button>
  `;
}

function earn(amount, t){
  balance += amount;
  localStorage.setItem("balance", balance);
  document.getElementById("balance").innerText = balance;

  if(t==2){
    document.getElementById("t3").classList.remove("locked");
    document.getElementById("t3").innerHTML = `
      <p>Task 3 → Earn $30</p>
      <button onclick="earn(30,3)">Complete</button>
    `;
  }

  alert("+$" + amount);
}

function locked(){
  alert("Complete previous task first");
}

function logout(){
  location.reload();
}
</script>

</body>
</html>
