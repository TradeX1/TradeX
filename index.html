<!DOCTYPE html>
<html>
<head>
<title>Trading Exchange</title>
<style>
body{
  margin:0;
  font-family: Arial;
  background:#0d0d0d;
  color:white;
}

.header{
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  background:#111;
  border-bottom:1px solid #222;
}

.container{
  padding:20px;
}

.card{
  background:#1a1a1a;
  padding:20px;
  border-radius:10px;
  margin-bottom:15px;
  text-align:center;
}

.balance{
  font-size:28px;
  color:orange;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:8px;
  background:orange;
  color:white;
  font-size:16px;
}
</style>
</head>

<body>

<div id="auth">

<div class="header">Trading Exchange</div>

<div class="container">

  <div class="card">
    <h3>Signup</h3>
    <input id="su_email" placeholder="Email">
    <input id="su_user" placeholder="Username">
    <input id="su_pass" type="password" placeholder="Password">
    <button onclick="signup()">Sign Up</button>
  </div>

  <div class="card">
    <h3>Login</h3>
    <input id="li_email" placeholder="Email">
    <input id="li_pass" type="password" placeholder="Password">
    <button onclick="login()">Login</button>
  </div>

</div>
<div id="dashboard" style="display:none">
  <h3>Welcome <span id="user"></span></h3>
  <h2>Balance: $<span id="bal">0</span></h2>

  <div id="adminPanel" style="display:none">
    <h3>Admin Panel</h3>
    <button onclick="add()">Increase Balance</button>
    <button onclick="minus()">Decrease Balance</button>
  </div>

  <button onclick="logout()">Logout</button>
</div>

<script>

let adminEmail = "goharg626@gmail.com";
let adminUser = "goharjaan";
let adminPass = "Pakistanh786";

function signup(){
  let email = su_email.value;
  let user = su_user.value;
  let pass = su_pass.value;

  let data = {email,user,pass,balance:0};
  localStorage.setItem(email, JSON.stringify(data));

  alert("Signup Success");
}

function login(){
  let email = li_email.value;
  let pass = li_pass.value;

  let data = JSON.parse(localStorage.getItem(email));

  if(data && data.pass == pass){
    localStorage.setItem("current", email);
    show();
  }else{
    alert("Wrong Login");
  }
}

function show(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));

  auth.style.display="none";
  dashboard.style.display="block";

  user.innerText = data.user;
  bal.innerText = data.balance;

  if(email==adminEmail && data.user==adminUser && data.pass==adminPass){
    adminPanel.style.display="block";
  }
}

function add(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));
  data.balance += 100;
  localStorage.setItem(email, JSON.stringify(data));
  show();
}

function minus(){
  let email = localStorage.getItem("current");
  let data = JSON.parse(localStorage.getItem(email));
  data.balance -= 100;
  localStorage.setItem(email, JSON.stringify(data));
  show();
}

function logout(){
  localStorage.removeItem("current");
  location.reload();
}

</script>

</body>
</html>
